<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나라시스템 경제 데이터 통계 대시보드</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 상단 네비게이션 메뉴 -->
  <nav>
    <div class="logo-container" onclick="showMainView()">
      <img src="logo.png" alt="로고" class="logo-img" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <span style="display:none; font-weight:bold; color:var(--primary-color);">NARA ECON</span>
    </div>
    <ul class="nav-menu">
      <li class="nav-item">
        <button id="nav-gdp-btn" onclick="switchCategory('GDP(10억달러)', 'GDP 순위 (전체)', '달러', 'nav-gdp-btn')">GDP순위</button>
      </li>
      <li class="nav-item">
        <button id="nav-def-btn" onclick="switchCategory('국방비(10억달러)', '국방비 순위 (전체)', '달러', 'nav-def-btn')">국방비순위</button>
      </li>
      <li class="nav-item">
        <button id="nav-pop-btn" onclick="switchCategory('인구(만명)', '인구 순위 (전체)', '명', 'nav-pop-btn')">인구순위</button>
      </li>
      <li class="nav-item">
        <button id="nav-cap-btn" onclick="switchCategory('1인당GDP', '1인당 GDP 순위 (전체)', '달러_직접', 'nav-cap-btn')">1인당GDP순위</button>
      </li>
    </ul>
  </nav>

  <div class="container">
    <div id="loading">데이터를 불러오는 중입니다...</div>

    <div id="dashboard" style="display: none;">
      
      <!-- 1. 메인 대시보드 화면 -->
      <div id="main-view">
        <div class="main-header">
          <h2 class="main-title">종목별 1위 현황</h2>
          <div class="year-badge" id="data-year">기준 연도 불러오는 중...</div>
        </div>

        <div class="top-cards-grid">
          <!-- GDP 1위 카드 -->
          <div class="top-card">
            <div>
              <div class="top-card-category">GDP 1위</div>
              <div class="top-card-country" id="top-gdp-country">-</div>
              <div class="top-card-val" id="top-gdp-val">-</div>
            </div>
            <button class="btn-go-rank" onclick="switchCategory('GDP(10억달러)', 'GDP 순위 (전체)', '달러', 'nav-gdp-btn')">순위 보러가기 →</button>
          </div>

          <!-- 국방비 1위 카드 -->
          <div class="top-card">
            <div>
              <div class="top-card-category">국방비 1위</div>
              <div class="top-card-country" id="top-def-country">-</div>
              <div class="top-card-val" id="top-def-val">-</div>
            </div>
            <button class="btn-go-rank" onclick="switchCategory('국방비(10억달러)', '국방비 순위 (전체)', '달러', 'nav-def-btn')">순위 보러가기 →</button>
          </div>

          <!-- 인구수 1위 카드 -->
          <div class="top-card">
            <div>
              <div class="top-card-category">인구수 1위</div>
              <div class="top-card-country" id="top-pop-country">-</div>
              <div class="top-card-val" id="top-pop-val">-</div>
            </div>
            <button class="btn-go-rank" onclick="switchCategory('인구(만명)', '인구 순위 (전체)', '명', 'nav-pop-btn')">순위 보러가기 →</button>
          </div>

          <!-- 1인당 GDP 1위 카드 -->
          <div class="top-card">
            <div>
              <div class="top-card-category">1인당 GDP 1위</div>
              <div class="top-card-country" id="top-cap-country">-</div>
              <div class="top-card-val" id="top-cap-val">-</div>
            </div>
            <button class="btn-go-rank" onclick="switchCategory('1인당GDP', '1인당 GDP 순위 (전체)', '달러_직접', 'nav-cap-btn')">순위 보러가기 →</button>
          </div>
        </div>

        <!-- 2. 세계 통계 섹션 -->
        <div class="world-stats-section">
          <h2 class="section-title">세계 통계</h2>
          <div class="world-cards-grid">
            <div class="world-card">
              <div class="world-card-title">세계 총 GDP</div>
              <div class="world-card-val" id="world-gdp">-</div>
            </div>
            <div class="world-card">
              <div class="world-card-title">세계 총 인구수</div>
              <div class="world-card-val" id="world-pop">-</div>
            </div>
            <div class="world-card">
              <div class="world-card-title">세계 총 국방비</div>
              <div class="world-card-val" id="world-def">-</div>
            </div>
            <div class="world-card">
              <div class="world-card-title">세계 평균 1인당 GDP</div>
              <div class="world-card-val" id="world-cap">-</div>
            </div>
          </div>
        </div>

      </div>

      <!-- 3. 순위 상세보기 화면 -->
      <div id="rank-view" style="display: none;">
        <div class="rank-section">
          <h3 id="rank-title" style="margin:0 0 16px 0;">순위 목록</h3>
          <ol class="rank-list" id="rank-list"></ol>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
