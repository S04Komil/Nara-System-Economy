name: Update Economy Data from Google Sheets

on:
  schedule:
    # 매시간 정각마다 자동 실행 (UTC 기준)
    - cron: '0 * * * *'
  # GitHub Actions 탭에서 수동 실행 가능
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth

      - name: Fetch data from Google Sheets
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          SPREADSHEET_ID_1: ${{ secrets.SPREADSHEET_ID_1 }}
          SPREADSHEET_ID_2: ${{ secrets.SPREADSHEET_ID_2 }}
          SPREADSHEET_ID_3: ${{ secrets.SPREADSHEET_ID_3 }}
          SPREADSHEET_ID_4: ${{ secrets.SPREADSHEET_ID_4 }}
          SPREADSHEET_ID_5: ${{ secrets.SPREADSHEET_ID_5 }}
        run: python fetch_sheets.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.json
          git status
          git commit -m "chore: update economic data [build $(date +'%Y-%m-%d %H:%M:%S')]" || exit 0
          git push
